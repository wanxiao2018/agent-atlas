name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Markdown source links
        run: python scripts/normalize_markdown_links.py --check

      - name: Validate project data
        run: python scripts/validate_project.py

      - name: Build documentation strictly
        run: mkdocs build --strict
