name: Normalize Markdown source links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/normalize_markdown_links.py'
      - '.github/workflows/normalize-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize source links
        run: python scripts/normalize_markdown_links.py

      - name: Commit normalized Markdown
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Markdown link normalization needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          git commit -m 'style: normalize Markdown source links'
          git push
